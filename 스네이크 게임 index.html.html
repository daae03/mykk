<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>스네이크 게임</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121922;
    --board: #0f161d;
    --grid: rgba(255, 255, 255, 0.035);
    --green: #39ff7a;
    --green-dark: #12a64a;
    --red: #ff4d6d;
    --text: #d9f7e4;
    --muted: #6f8a7b;
    --btn: #1a2530;
    --btn-active: #243444;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at top, #121c26 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  .app {
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  }

  h1 {
    margin: 0;
    font-size: 14px;
    letter-spacing: 0.35em;
    color: var(--green);
    text-shadow: 0 0 10px rgba(57, 255, 122, 0.6);
    font-weight: 800;
    text-align: center;
  }

  .game {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* 점수판 */
  .hud {
    width: var(--size);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--panel);
    border: 1px solid rgba(57, 255, 122, 0.18);
    border-radius: 12px;
    font-variant-numeric: tabular-nums;
  }
  .hud .item { display: flex; flex-direction: column; line-height: 1.15; }
  .hud .item.right { align-items: flex-end; }
  .hud .label { font-size: 11px; color: var(--muted); letter-spacing: 0.12em; }
  .hud .value { font-size: 24px; font-weight: 800; color: var(--green); text-shadow: 0 0 8px rgba(57,255,122,.45); }
  .hud .value.best { color: #ffd166; text-shadow: 0 0 8px rgba(255,209,102,.35); }

  :root { --size: min(94vw, calc(100vh - 360px), 560px); }
  @supports (height: 100dvh) {
    :root { --size: min(94vw, calc(100dvh - 360px), 560px); }
  }

  /* 게임판 */
  .board-wrap {
    position: relative;
    width: var(--size);
    height: var(--size);
    border-radius: 12px;
    border: 2px solid var(--green-dark);
    box-shadow: 0 0 24px rgba(57, 255, 122, 0.25), inset 0 0 30px rgba(0,0,0,.6);
    overflow: hidden;
    background: var(--board);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    background: rgba(5, 8, 12, 0.72);
    backdrop-filter: blur(2px);
    padding: 16px;
    transition: opacity .15s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay .title { font-size: clamp(22px, 7vw, 34px); font-weight: 900; color: var(--green); text-shadow: 0 0 14px rgba(57,255,122,.7); }
  .overlay .title.over { color: var(--red); text-shadow: 0 0 14px rgba(255,77,109,.7); }
  .overlay .sub { font-size: clamp(12px, 3.6vw, 15px); color: var(--text); opacity: .85; line-height: 1.5; }

  /* 버튼 */
  .actions { display: flex; gap: 8px; width: var(--size); }
  .actions button {
    flex: 1;
    min-height: 46px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    background: var(--btn);
    border: 1px solid rgba(57, 255, 122, 0.35);
    border-radius: 10px;
    cursor: pointer;
    transition: transform .06s, background .15s, box-shadow .15s;
  }
  .actions button:hover:not(:disabled) { background: var(--btn-active); box-shadow: 0 0 10px rgba(57,255,122,.25); }
  .actions button:active:not(:disabled) { transform: scale(0.96); }
  .actions button:disabled { opacity: .35; cursor: not-allowed; }
  .actions button.primary { background: var(--green-dark); border-color: var(--green); color: #04150a; }
  .actions button.primary:hover:not(:disabled) { background: #19c25a; }

  /* 터치 방향 버튼 (스마트폰/태블릿) */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
    width: min(260px, 70vw);
  }
  .dpad button {
    aspect-ratio: 1.15 / 1;
    min-height: 58px;
    font-size: 26px;
    color: var(--green);
    background: var(--btn);
    border: 1px solid rgba(57, 255, 122, 0.35);
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
    padding: 0;
  }
  .dpad button:active, .dpad button.pressed { background: var(--btn-active); box-shadow: 0 0 12px rgba(57,255,122,.45); transform: scale(0.95); }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }

  .hint { font-size: 12px; color: var(--muted); text-align: center; }

  @media (pointer: coarse), (max-width: 820px) {
    .dpad { display: grid; }
    .hint { display: none; }
  }

  /* 가로 모드의 낮은 화면(스마트폰 가로) */
  @media (orientation: landscape) and (max-height: 520px) {
    :root { --size: min(calc(100vh - 28px), 62vw); }
    @supports (height: 100dvh) {
      :root { --size: min(calc(100dvh - 28px), 62vw); }
    }
    .app { padding: 8px; }
    h1 { display: none; }
    .game {
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      gap: 12px 20px;
    }
    .board-wrap { grid-column: 1; grid-row: 1 / span 3; }
    .hud, .actions { width: min(260px, 30vw); grid-column: 2; }
    .hud { grid-row: 1; }
    .actions { grid-row: 2; }
    .actions button { min-height: 40px; font-size: 14px; padding: 0 4px; }
    .dpad { grid-column: 2; grid-row: 3; width: min(220px, 30vw); gap: 6px; }
    .dpad button { min-height: 44px; font-size: 22px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>SNAKE ARCADE</h1>

  <div class="game">
    <div class="hud">
      <div class="item">
        <span class="label">점수</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="item right">
        <span class="label">최고 점수</span>
        <span class="value best" id="best">0</span>
      </div>
    </div>

    <div class="board-wrap" id="boardWrap">
      <canvas id="canvas"></canvas>
      <div class="overlay" id="overlay">
        <div class="title" id="ovTitle">SNAKE</div>
        <div class="sub" id="ovSub">‘시작’ 버튼을 눌러 게임을 시작하세요</div>
      </div>
    </div>

    <div class="actions">
      <button id="btnStart" class="primary">시작</button>
      <button id="btnPause" disabled>일시정지</button>
      <button id="btnRestart">다시 시작</button>
    </div>

    <div class="dpad" id="dpad" aria-label="방향 버튼">
      <button class="up"    data-dir="up"    aria-label="위">▲</button>
      <button class="left"  data-dir="left"  aria-label="왼쪽">◀</button>
      <button class="down"  data-dir="down"  aria-label="아래">▼</button>
      <button class="right" data-dir="right" aria-label="오른쪽">▶</button>
    </div>

    <div class="hint">방향키로 이동 · 스페이스바로 일시정지/재개</div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ===== 설정 =====
  const GRID = 20;          // 20 x 20
  const TICK_MS = 220;      // 일정한 이동 속도 (초보자용: 느리게)
  const POINTS = 10;        // 먹이 1개당 점수
  const MAX_QUEUE = 3;      // 빠른 연타 입력을 위한 방향 큐 크기

  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  },
  };

  // ===== 요소 =====
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovSub = document.getElementById('ovSub');
  const btnStart = document.getElementById('btnStart');
  const btnPause = document.getElementById('btnPause');
  const btnRestart = document.getElementById('btnRestart');
  const wrap = document.getElementById('boardWrap');

  // ===== 상태 =====
  let snake, dir, dirQueue, food, score, best, state, timer;
  // state: 'ready' | 'running' | 'paused' | 'over'

  best = 0;
  try { best = parseInt(localStorage.getItem('snake-best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [
      { x: mid,     y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
    ];
    dir = 'right';
    dirQueue = [];
    score = 0;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    const free = [];
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        if (!occupied.has(x + ',' + y)) free.push({ x, y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  // ===== 게임 진행 =====
  function startLoop() {
    stopLoop();
    timer = setInterval(tick, TICK_MS);
  }
  function stopLoop() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  function startGame() {
    if (state === 'paused') return resumeGame();
    if (state === 'running') return;
    reset();
    state = 'running';
    hideOverlay();
    updateButtons();
    startLoop();
    draw();
  }

  function pauseGame() {
    if (state !== 'running') return;
    state = 'paused';
    stopLoop();
    showOverlay('일시정지', '‘계속’ 버튼 또는 스페이스바로 재개');
    updateButtons();
  }

  function resumeGame() {
    if (state !== 'paused') return;
    state = 'running';
    hideOverlay();
    updateButtons();
    startLoop();
  }

  function togglePause() {
    if (state === 'running') pauseGame();
    else if (state === 'paused') resumeGame();
  }

  function restartGame() {
    stopLoop();
    state = 'ready';
    startGame();
  }

  function gameOver(cleared) {
    state = 'over';
    stopLoop();
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snake-best', String(best)); } catch (e) {}
    }
    showOverlay(
      cleared ? 'CLEAR!' : 'GAME OVER',
      '점수: ' + score + '점<br>‘다시 시작’ 버튼을 눌러 보세요',
      !cleared
    );
    updateButtons();
    draw();
  }

  function tick() {
    if (state !== 'running') return;

    // 큐에 쌓인 방향 입력 하나를 적용
    if (dirQueue.length) dir = dirQueue.shift();

    const d = DIRS[dir];
    const head = { x: snake[0].x + d.x, y: snake[0].y + d.y };

    // 벽 충돌
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) {
      return gameOver(false);
    }

    const eating = food && head.x === food.x && head.y === food.y;

    // 자기 몸 충돌 (먹지 않으면 꼬리는 비켜나므로 제외)
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver(false);
    }

    snake.unshift(head);
    if (eating) {
      score += POINTS;
      scoreEl.textContent = score;
      placeFood();
      if (!food) { draw(); return gameOver(true); }
    } else {
      snake.pop();
    }
    draw();
  }

  // ===== 입력 =====
  function changeDir(name) {
    if (state !== 'running') return;
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    if (name === last) return;                                   // 같은 방향 무시
    const a = DIRS[name], b = DIRS[last];
    if (a.x + b.x === 0 && a.y + b.y === 0) return;              // 반대 방향 무시
    if (dirQueue.length >= MAX_QUEUE) return;
    dirQueue.push(name);
  }

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  };

  window.addEventListener('keydown', (e) => {
    if (KEYMAP[e.key]) {
      e.preventDefault();
      changeDir(KEYMAP[e.key]);
    } else if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'running' || state === 'paused') togglePause();
      else if (state === 'ready') startGame();
    }
  }, { passive: false });

  // 터치 방향 버튼 (pointerdown으로 즉각 반응)
  document.querySelectorAll('#dpad button').forEach(btn => {
    const press = (e) => {
      e.preventDefault();
      btn.classList.add('pressed');
      changeDir(btn.dataset.dir);
    };
    const release = () => btn.classList.remove('pressed');
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  });

  // 게임판 스와이프 (보너스 조작)
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) changeDir(dx > 0 ? 'right' : 'left');
    else changeDir(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  // 버튼
  btnStart.addEventListener('click', startGame);
  btnPause.addEventListener('click', togglePause);
  btnRestart.addEventListener('click', restartGame);

  // 탭이 가려지면 자동 일시정지
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'running') pauseGame();
  });

  function updateButtons() {
    btnStart.disabled = (state === 'running' || state === 'over');
    btnPause.disabled = !(state === 'running' || state === 'paused');
    btnPause.textContent = state === 'paused' ? '계속' : '일시정지';
    btnStart.textContent = state === 'paused' ? '계속하기' : '시작';
  }

  function showOverlay(title, sub, isOver) {
    ovTitle.textContent = title;
    ovTitle.classList.toggle('over', !!isOver);
    ovSub.innerHTML = sub;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  // ===== 렌더링 =====
  let cssSize = 0, cell = 0;

  function resize() {
    const rect = wrap.getBoundingClientRect();
    const size = Math.floor(rect.width);
    if (!size) return;
    const dpr = window.devicePixelRatio || 1;
    cssSize = size;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(canvas.width / GRID / (size / GRID), 0, 0, canvas.height / size, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / GRID;
    draw();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    if (!cell || !snake) { if (cell) drawEmpty(); return; }

    // 배경
    ctx.fillStyle = '#0f161d';
    ctx.fillRect(0, 0, cssSize, cssSize);

    // 격자
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < GRID; i++) {
      const p = Math.round(i * cell) + 0.5;
      ctx.moveTo(p, 0); ctx.lineTo(p, cssSize);
      ctx.moveTo(0, p); ctx.lineTo(cssSize, p);
    }
    ctx.stroke();

    // 먹이
    if (food) {
      const cx = (food.x + 0.5) * cell;
      const cy = (food.y + 0.5) * cell;
      ctx.save();
      ctx.shadowColor = '#ff4d6d';
      ctx.shadowBlur = cell * 0.8;
      ctx.fillStyle = '#ff4d6d';
      ctx.beginPath();
      ctx.arc(cx, cy, cell * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.arc(cx - cell * 0.1, cy - cell * 0.1, cell * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }

    // 뱀
    const pad = Math.max(1, cell * 0.08);
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const s = snake[i];
      const t = n > 1 ? i / (n - 1) : 0;           // 0(머리) ~ 1(꼬리)
      const g = Math.round(255 - t * 90);
      const r = Math.round(57 - t * 35);
      const b = Math.round(122 - t * 60);
      ctx.save();
      if (i === 0) { ctx.shadowColor = '#39ff7a'; ctx.shadowBlur = cell * 0.6; }
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.28);
      ctx.fill();
      ctx.restore();
    }

    // 눈
    const h = snake[0];
    const d = DIRS[dir];
    const hx = (h.x + 0.5) * cell, hy = (h.y + 0.5) * cell;
    const px = -d.y, py = d.x; // 수직 벡터
    const fwd = cell * 0.16, side = cell * 0.17, er = cell * 0.085;
    ctx.fillStyle = '#04150a';
    [-1, 1].forEach(sg => {
      ctx.beginPath();
      ctx.arc(hx + d.x * fwd + px * side * sg, hy + d.y * fwd + py * side * sg, er, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawEmpty() {
    ctx.fillStyle = '#0f161d';
    ctx.fillRect(0, 0, cssSize, cssSize);
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < GRID; i++) {
      const p = Math.round(i * cell) + 0.5;
      ctx.moveTo(p, 0); ctx.lineTo(p, cssSize);
      ctx.moveTo(0, p); ctx.lineTo(cssSize, p);
    }
    ctx.stroke();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);

  // ===== 초기화 =====
  reset();
  state = 'ready';
  updateButtons();
  resize();
})();
</script>
</body>
</html>
